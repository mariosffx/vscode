[tools]
node = "24.18.0"

# ---------------------------------------------------------------------------
# Upstream (microsoft/vscode) tracking
#
# Remotes: `upstream` = microsoft/vscode, `origin` = your fork.
# `main` is kept as a clean mirror of upstream/main; your own work lives on
# feature branches that get rebased on top of it.
# ---------------------------------------------------------------------------

[tasks."upstream:sync"]
description = "Fetch microsoft/vscode, fast-forward local main to upstream/main and push it to the fork"
shell = "bash -c"
run = """
set -euo pipefail
if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
	echo "error: working tree has uncommitted changes; commit or stash them first" >&2
	exit 1
fi
current=$(git branch --show-current)
echo "==> fetching upstream"
git fetch --prune upstream
echo "==> updating main from upstream/main"
if [ "$current" = "main" ]; then
	git merge --ff-only upstream/main
else
	# update main without checking it out; fails if it would not be a fast-forward
	git fetch . upstream/main:main
fi
echo "==> pushing main to origin (fork)"
git push origin main:main
echo "==> main is at $(git rev-parse --short main): $(git log -1 --format=%s main)"
"""

[tasks."upstream:rebase"]
description = "Sync upstream, then rebase the current feature branch onto main"
shell = "bash -c"
depends = ["upstream:sync"]
run = """
set -euo pipefail
current=$(git branch --show-current)
if [ "$current" = "main" ] || [ -z "$current" ]; then
	echo "nothing to rebase: check out a feature branch first" >&2
	exit 1
fi
behind=$(git rev-list --count "$current..main")
if [ "$behind" = "0" ]; then
	echo "==> $current is already up to date with main"
	exit 0
fi
echo "==> rebasing $current onto main ($behind new upstream commits)"
git rebase main
echo "==> done. Push with: git push --force-with-lease origin $current"
"""

[tasks."upstream:status"]
description = "Show how far main and the current branch are from upstream"
shell = "bash -c"
run = """
set -euo pipefail
git fetch --quiet --prune upstream
echo "upstream/main: $(git log -1 --format='%h %s' upstream/main)"
echo "main:          $(git log -1 --format='%h %s' main)  (behind upstream by $(git rev-list --count main..upstream/main))"
current=$(git branch --show-current)
if [ "$current" != "main" ] && [ -n "$current" ]; then
	echo "$current: $(git rev-list --count main..$current) own commits, $(git rev-list --count $current..main) commits behind main"
fi
"""

[tasks.update]
description = "Everything in one go: sync upstream, rebase this branch, push it to the fork, install deps, full build"
shell = "bash -c"
depends = ["upstream:rebase"]
run = """
set -euo pipefail
current=$(git branch --show-current)
if [ "$current" != "main" ] && [ -n "$current" ] && git rev-parse --verify --quiet "origin/$current" >/dev/null; then
	echo "==> pushing rebased $current to origin"
	git push --force-with-lease origin "$current"
fi
echo "==> installing dependencies"
npm run install-fast
echo "==> full build"
npm run compile
echo "==> up to date and built; launch with: mise run start"
"""

# ---------------------------------------------------------------------------
# Building and running
# ---------------------------------------------------------------------------

[tasks.install]
description = "Install dependencies (skips when already up to date)"
run = "npm run install-fast"

[tasks.build]
description = "Full build: client plus all built-in extensions (needed before `mise run start`)"
run = "npm run compile"

[tasks."build:fast"]
description = "Quick client-only transpile into out/ (enough for unit tests, not for launching)"
run = "npm run build-fast -- --client-only"

[tasks.watch]
description = "Incremental watch build of client and extensions"
run = "npm run watch"

[tasks.typecheck]
description = "Type-check the client sources under src/"
run = "npm run typecheck-client"

[tasks.lint]
description = "Lint the files changed on this branch relative to main"
shell = "bash -c"
run = """
set -euo pipefail
files=$(git diff --name-only main...HEAD -- '*.ts' | while read -r f; do [ -f "$f" ] && echo "$f"; done)
if [ -z "$files" ]; then echo "no changed TypeScript files"; exit 0; fi
npm run eslint -- $files
"""

[tasks.test]
description = "Run unit tests; pass a grep pattern, e.g. `mise run test ActivitybarPart`"
shell = "bash -c"
# mise appends task arguments to the end of the script, so the last line is a
# function call that receives them as positional parameters.
run = """
run_tests() {
	if [ $# -gt 0 ]; then
		env -u ELECTRON_RUN_AS_NODE ./scripts/test.sh --grep "$1"
	else
		env -u ELECTRON_RUN_AS_NODE ./scripts/test.sh
	fi
}
run_tests"""

[tasks.start]
description = "Launch Code OSS from the build output (run `mise run build` first); extra args go to code.sh"
shell = "bash -c"
run = "exec env -u ELECTRON_RUN_AS_NODE ./scripts/code.sh"

# ---------------------------------------------------------------------------
# Release packaging (standalone app folders and installers)
#
# These bundle the compiled sources together with Electron into a real,
# installable app. They are slow (10-20 minutes) and always start from a
# fresh production compile, so use the dev build (`mise run start`) for
# day-to-day work and these only when you want something to install.
# ---------------------------------------------------------------------------

[tasks."release:compile"]
description = "Optional: CI-style production type check and bundles (the release:* tasks compile on their own)"
run = "npm run gulp core-ci"

[tasks."release:linux"]
description = "Package a standalone Linux x64 app folder at ../VSCode-linux-x64 (run ../VSCode-linux-x64/code-oss)"
shell = "bash -c"
run = """
set -euo pipefail
npm run gulp vscode-linux-x64-min
echo "==> app folder: $(cd .. && pwd)/VSCode-linux-x64  (launch: ../VSCode-linux-x64/code-oss)"
"""

[tasks."release:debian"]
description = "Build a .deb package (needs fakeroot and dpkg-deb); output in .build/linux/deb/amd64/deb/"
shell = "bash -c"
depends = ["release:linux"]
run = """
set -euo pipefail
for tool in fakeroot dpkg-deb; do
	command -v "$tool" >/dev/null || { echo "error: $tool not found; install with: sudo apt install fakeroot dpkg" >&2; exit 1; }
done
# dpkg-shlibdeps crashes against the Debian 11 sysroot on newer Ubuntu; use the committed
# dependency list instead (see build/linux/dependencies-generator.ts)
VSCODE_LINUX_DEPS_FROM_REFERENCE=1 npm run gulp vscode-linux-x64-prepare-deb
npm run gulp vscode-linux-x64-build-deb
echo "==> package: $(ls -1 .build/linux/deb/amd64/deb/*.deb)  (install: sudo apt install ./<file>.deb)"
"""

[tasks."release:rpm"]
description = "Build an .rpm package (needs rpmbuild); output in .build/linux/rpm/x86_64/"
shell = "bash -c"
depends = ["release:linux"]
run = """
set -euo pipefail
command -v rpmbuild >/dev/null || { echo "error: rpmbuild not found; install with: sudo apt install rpm" >&2; exit 1; }
VSCODE_LINUX_DEPS_FROM_REFERENCE=1 npm run gulp vscode-linux-x64-prepare-rpm
npm run gulp vscode-linux-x64-build-rpm
echo "==> package: $(ls -1 .build/linux/rpm/x86_64/*.rpm)"
"""

[tasks."release:windows"]
description = "Package Windows x64: app folder at ../VSCode-win32-x64 plus a per-user installer (runs on Windows only)"
# no `shell` here: it would also apply to run_windows
run = """
echo "error: release:windows must run on a Windows machine." >&2
echo "       There: clone the fork, run 'mise run install', then 'mise run release:windows'." >&2
exit 1
"""
run_windows = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/mise/release-windows.ps1"
# ---------------------------------------------------------------------------
# Install the packaged build on this machine
#
# Both tasks reuse the newest package when it was built from the current commit
# and rebuild it otherwise, so an outdated build is never installed by accident.
# ---------------------------------------------------------------------------

[tasks."install:debian"]
description = "Install the .deb on this machine (rebuilds it first when missing or built from another commit); asks for sudo"
shell = "bash -c"
raw = true # lets sudo prompt for the password
run = """
set -euo pipefail
head=$(git rev-parse HEAD)
packaged=$(node -p "try { require('../VSCode-linux-x64/resources/app/product.json').commit } catch { '' }")
deb=$(ls -1t .build/linux/deb/amd64/deb/*.deb 2>/dev/null | head -n1 || true)
if [ -n "$(git status --porcelain -- src extensions)" ]; then
	echo "warning: uncommitted changes in src/ or extensions/ are not detected; commit them or run 'mise run release:debian' to include them" >&2
fi
if [ -z "$deb" ] || [ "$packaged" != "$head" ]; then
	echo "==> package missing or built from ${packaged:-nothing}, HEAD is $head: building"
	mise run release:debian
	deb=$(ls -1t .build/linux/deb/amd64/deb/*.deb | head -n1)
else
	echo "==> reusing $deb (built from HEAD)"
fi
echo "==> installing $deb"
sudo apt install -y "./$deb"
echo "==> installed: $(dpkg -s code-oss | sed -n 's/^Version: //p'); launch with 'code-oss' or from your app menu"
"""

[tasks."install:windows"]
description = "Install Code - OSS for the current user on Windows (rebuilds the installer first when missing or built from another commit)"
run = """
echo "error: install:windows must run on a Windows machine." >&2
echo "       There: clone the fork, run 'mise run install', then 'mise run install:windows'." >&2
exit 1
"""
run_windows = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/mise/install-windows.ps1"